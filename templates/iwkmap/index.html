<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bike Parking — IWK</title>
<!--
  ============================================================================
  IWK BIKE PARKING MAP  —  standalone, portable module
  ----------------------------------------------------------------------------
  • No frameworks, no build step. Plain HTML + CSS + one <script>.
  • Drop this file and the /assets folder into ColdFusion or SharePoint.
  • To add / move / edit spots: edit the SPOTS array near the bottom of this
    file (or paste an exported array from the editor). Nothing else to touch.
  • Photos live in /static/iwkmap/assets/photos/ ; floor plans in /static/iwkmap/assets/floors/ .
  ============================================================================
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  .bpk *{box-sizing:border-box}
  .bpk{font-family:'IBM Plex Sans',system-ui,Segoe UI,Arial,sans-serif;color:#26314d;max-width:820px}
  .bpk h1{font:700 32px/1.05 'Space Grotesk','Segoe UI',sans-serif;letter-spacing:-.02em;margin:0}
  .bpk .bpk-intro{font:400 15px/1.55 'IBM Plex Sans',sans-serif;color:rgba(38,49,77,.65);margin:10px 0 26px;max-width:640px}
  .bpk-frame{border:1px solid rgba(38,49,77,.11);border-radius:16px;overflow:hidden}
  .bpk-lvl{border-bottom:1px solid rgba(38,49,77,.08)}
  .bpk-lvl:last-child{border-bottom:none}
  .bpk-head{width:100%;display:flex;align-items:center;gap:14px;padding:20px 26px;background:#fff;border:none;cursor:pointer;text-align:left;font-family:inherit}
  .bpk-head:hover{background:rgba(38,49,77,.03)}
  .bpk-dot{flex:none;width:13px;height:13px;border-radius:50%}
  .bpk-name{font:600 19px 'Space Grotesk',sans-serif;flex:1}
  .bpk-summary{font:500 14px 'IBM Plex Sans',sans-serif;color:rgba(38,49,77,.5)}
  .bpk-caret{font:400 24px system-ui;color:rgba(38,49,77,.4);transition:transform .15s;display:inline-block}
  .bpk-lvl.open .bpk-caret{transform:rotate(90deg)}
  .bpk-body{display:none;padding:4px 26px 26px;grid-template-columns:340px 1fr;gap:24px;align-items:start}
  .bpk-lvl.open .bpk-body{display:grid}
  .bpk-lvl.zoom .bpk-body{display:block}
  .bpk-planwrap{position:relative}
  .bpk-lvl.zoom .bpk-planwrap{margin-bottom:22px}
  .bpk-plan{position:relative;width:100%;background:#f5f3ee;border:1px solid rgba(38,49,77,.1);border-radius:12px;overflow:hidden;cursor:zoom-in}
  .bpk-lvl.zoom .bpk-plan{overflow:auto;max-height:560px;cursor:zoom-out}
  .bpk-plan-inner{position:relative;width:100%}
  .bpk-lvl.zoom .bpk-plan-inner{width:160%}
  .bpk-plan img{display:block;width:100%;filter:grayscale(.35) brightness(1.03) contrast(.95) opacity(.9);user-select:none}
  .bpk-zoomhint{position:absolute;top:10px;right:10px;z-index:3;background:rgba(38,49,77,.85);color:#fff;font:600 11px 'IBM Plex Sans',sans-serif;padding:5px 11px;border-radius:20px;pointer-events:none}
  .bpk-pin{position:absolute;transform:translate(-50%,-50%);width:24px;height:24px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(38,49,77,.35);color:#fff;font:700 11px 'Space Grotesk',sans-serif;display:flex;align-items:center;justify-content:center;z-index:2}
  .bpk-cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .bpk-lvl.zoom .bpk-cards{grid-template-columns:repeat(3,1fr)}
  .bpk-card{background:#fff;border:1px solid rgba(38,49,77,.1);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .bpk-photo{position:relative;height:140px;background:repeating-linear-gradient(135deg,#eceae3 0 11px,#f5f3ee 11px 22px);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font:500 10px ui-monospace,Menlo,monospace;color:rgba(38,49,77,.4)}
  .bpk-photo.has{cursor:zoom-in}
  .bpk-thumb{flex:none;width:52px;height:40px;border-radius:6px;background-size:cover;background-position:center;box-shadow:0 0 0 1px rgba(38,49,77,.12);cursor:zoom-in}
  .bpk-lb{position:fixed;inset:0;z-index:9999;background:rgba(11,24,21,.86);display:none;align-items:center;justify-content:center;padding:32px}
  .bpk-lb.on{display:flex}
  .bpk-lb img{max-width:92vw;max-height:82vh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .bpk-lb-close{position:absolute;top:20px;right:24px;width:44px;height:44px;border-radius:50%;border:none;background:rgba(255,255,255,.16);color:#fff;font:400 24px system-ui;cursor:pointer;line-height:1}
  .bpk-lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;border:none;background:rgba(255,255,255,.16);color:#fff;font:400 30px system-ui;cursor:pointer;line-height:1}
  .bpk-lb-nav.prev{left:20px}
  .bpk-lb-nav.next{right:20px}
  .bpk-lb-cap{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:rgba(255,255,255,.85);font:500 13px 'IBM Plex Sans',sans-serif}
  .bpk-corner{position:absolute;top:10px;left:10px;width:30px;height:30px;border-radius:50%;color:#fff;border:2px solid #fff;font:700 14px 'Space Grotesk',sans-serif;display:flex;align-items:center;justify-content:center}
  .bpk-count{position:absolute;right:8px;bottom:8px;font:600 10.5px 'IBM Plex Sans',sans-serif;padding:3px 8px;border-radius:20px;background:rgba(38,49,77,.82);color:#fff}
  .bpk-strip{display:flex;gap:6px;padding:8px 10px 0;flex-wrap:wrap}
  .bpk-info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:9px;flex:1}
  .bpk-title{font:600 16px/1.2 'Space Grotesk',sans-serif}
  .bpk-badges{display:flex;flex-wrap:wrap;gap:6px}
  .bpk-badge{font:600 11px 'IBM Plex Sans',sans-serif;padding:3px 10px;border-radius:20px}
  @media (max-width:640px){
    .bpk-body,.bpk-lvl.open .bpk-body{grid-template-columns:1fr}
    .bpk-cards{grid-template-columns:1fr}
  }
</style>
</head>
<body style="margin:0;background:#fff;padding:30px 40px 40px">

<div class="bpk">
  <h1>Bike Parking</h1>
  <p class="bpk-intro">Secure bike parking is available across the IWK campus. Pick a level to see photos, or click any floor plan to enlarge it.</p>
  <div class="bpk-frame" id="bpk-frame"></div>
</div>

<div class="bpk-lb" id="bpk-lb">
  <button class="bpk-lb-close" type="button" data-lb="close">×</button>
  <button class="bpk-lb-nav prev" type="button" data-lb="prev">‹</button>
  <img id="bpk-lb-img" src="" alt="">
  <button class="bpk-lb-nav next" type="button" data-lb="next">›</button>
  <div class="bpk-lb-cap" id="bpk-lb-cap"></div>
</div>

<script>
/* ============================================================================
   SPOT DATA — edit this array to add / move / update parking spots.
   Fields: id, floor (1 | 2 | "outside"), name, x/y (% on the plan, 0–100),
           covered, indoor, capacity, entrance, photos: [ "/static/iwkmap/assets/photos/..." ]
   ========================================================================= */
const SPOTS = [
  {"id":"f1-imaging","floor":1,"name":"Women's Garage","x":33.6,"y":55.4,"covered":true,"indoor":true,"capacity":4,"photos":["/static/iwkmap/assets/photos/IMG_6588.jpeg","/static/iwkmap/assets/photos/IMG_6589.jpeg"]},
  {"id":"f1-womens","floor":1,"name":"Women's Garage","x":19.1,"y":70,"covered":true,"indoor":true,"capacity":12,"photos":["/static/iwkmap/assets/photos/IMG_6590.jpeg","/static/iwkmap/assets/photos/IMG_6591.jpeg"]},
  {"id":"f1-ed","floor":1,"name":"Environmental Services Adjacent","x":23.4,"y":94,"covered":true,"indoor":true,"capacity":12,"photos":["/static/iwkmap/assets/photos/IMG_6592.jpeg","/static/iwkmap/assets/photos/IMG_6593.jpeg","/static/iwkmap/assets/photos/IMG_6594.jpeg"]},
  {"id":"f2-research","floor":2,"name":"Protection Services","x":54.7,"y":5.2,"covered":true,"indoor":true,"capacity":6,"photos":["/static/iwkmap/assets/photos/IMG_6595.jpeg"]},
  {"id":"f2-parkade","floor":2,"name":"Protection Services","x":35,"y":5,"covered":true,"indoor":true,"capacity":16,"photos":["/static/iwkmap/assets/photos/IMG_6596.jpeg","/static/iwkmap/assets/photos/IMG_6597.jpeg","/static/iwkmap/assets/photos/IMG_6598.jpeg"]},
  {"id":"spot-6","floor":"outside","name":"Women's Building - Main Entrance","x":42.1,"y":48.3,"covered":true,"indoor":false,"capacity":12,"photos":["/static/iwkmap/assets/photos/IMG_6599.jpeg"]},
  {"id":"spot-7","floor":"outside","name":"Women's Building - Entrance","x":31.1,"y":46.1,"covered":false,"indoor":false,"capacity":18,"photos":["/static/iwkmap/assets/photos/IMG_6600.jpeg","/static/iwkmap/assets/photos/IMG_6601.jpeg"]},
  {"id":"spot-8","floor":"outside","name":"Women's Building - West","x":23.6,"y":51.4,"covered":false,"indoor":false,"capacity":12,"photos":["/static/iwkmap/assets/photos/IMG_6602.jpeg","/static/iwkmap/assets/photos/IMG_6603.jpeg"]},
  {"id":"spot-9","floor":"outside","name":"Women's Building - South West","x":21,"y":73.8,"covered":false,"indoor":false,"capacity":2,"photos":["/static/iwkmap/assets/photos/IMG_6604.jpeg"]},
  {"id":"spot-10","floor":"outside","name":"Children's Building - South","x":60,"y":80.8,"covered":false,"indoor":false,"capacity":12,"photos":["/static/iwkmap/assets/photos/IMG_6605.jpeg","/static/iwkmap/assets/photos/IMG_6606.jpeg"]},
  {"id":"spot-11","floor":"outside","name":"Children's Building - Entrance","x":66.6,"y":75,"covered":false,"indoor":false,"capacity":8,"photos":["/static/iwkmap/assets/photos/IMG_6607.jpeg"]},
];

/* Level order & labels. Add a row here if you introduce a new floor value. */
const LEVELS = [
  { key:1,         label:"Floor 1", img:"/static/iwkmap/assets/floors/floor-1.png" },
  { key:2,         label:"Floor 2", img:"/static/iwkmap/assets/floors/floor-2.png" },
  { key:"outside", label:"Outside", img:"/static/iwkmap/assets/floors/floor-0.png" },
];

/* --------------------------------------------------------------------------- */
(function () {
  const GREEN = "#0071ce", ORANGE = "#c97a2b";
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
  const photosOf = s => Array.isArray(s.photos) ? s.photos.filter(Boolean) : (s.photo ? [s.photo] : []);
  const color = s => s.covered ? GREEN : ORANGE;

  const frame = document.getElementById("bpk-frame");
  const openState = {};   // level key -> bool
  const zoomState = {};   // level key -> bool
  let letterMap = {};

  // assign A, B, C... in data order (stable across levels)
  SPOTS.forEach((s, i) => { letterMap[s.id] = String.fromCharCode(65 + i); });

  function render() {
    frame.innerHTML = "";
    LEVELS.forEach((lvl, idx) => {
      const spots = SPOTS.filter(s => s.floor === lvl.key);
      if (!spots.length) return;
      if (openState[lvl.key] === undefined) openState[lvl.key] = (idx === 0);

      const cap = spots.reduce((t, s) => t + (+s.capacity || 0), 0);
      const allCovered = spots.every(s => s.covered);

      const el = document.createElement("div");
      el.className = "bpk-lvl" + (openState[lvl.key] ? " open" : "") + (zoomState[lvl.key] ? " zoom" : "");

      const pins = spots.map(s =>
        `<span class="bpk-pin" title="${esc(s.name)}" style="left:${s.x}%;top:${s.y}%;background:${color(s)}">${letterMap[s.id]}</span>`
      ).join("");

      const cards = spots.map(s => {
        const ph = photosOf(s);
        const bg = ph[0] ? `background-image:url('${esc(ph[0])}')` : "";
        const count = ph.length > 1 ? `<span class="bpk-count">▦ ${ph.length} photos</span>` : "";
        const strip = ph.length > 1
          ? `<div class="bpk-strip">${ph.map((p, pi) => `<div class="bpk-thumb" data-photo="${esc(s.id)}" data-idx="${pi}" style="background-image:url('${esc(p)}')"></div>`).join("")}</div>`
          : "";
        const label = ph[0] ? "" : "rack photo";
        const typeBadge = s.covered
          ? `<span class="bpk-badge" style="background:rgba(0,113,206,.14);color:${GREEN}">Covered</span>`
          : `<span class="bpk-badge" style="background:rgba(201,122,43,.16);color:${ORANGE}">Uncovered</span>`;
        const placeBadge = `<span class="bpk-badge" style="background:rgba(38,49,77,.06);color:#26314d">${s.indoor ? "Indoor" : "Outdoor"}</span>`;
        const capBadge = `<span class="bpk-badge" style="background:rgba(38,49,77,.06);color:#26314d">${+s.capacity || 0} bikes</span>`;
        return `<div class="bpk-card">
          <div class="bpk-photo${ph[0] ? " has" : ""}" style="${bg}"${ph[0] ? ` data-photo="${esc(s.id)}" data-idx="0"` : ""}>${label}
            <span class="bpk-corner" style="background:${color(s)}">${letterMap[s.id]}</span>${count}
          </div>${strip}
          <div class="bpk-info">
            <div class="bpk-title">${esc(s.name)}</div>
            <div class="bpk-badges">${typeBadge}${placeBadge}${capBadge}</div>
          </div>
        </div>`;
      }).join("");

      el.innerHTML = `
        <button class="bpk-head" type="button" data-toggle="${esc(String(lvl.key))}">
          <span class="bpk-dot" style="background:${allCovered ? GREEN : ORANGE}"></span>
          <span class="bpk-name">${esc(lvl.label)}</span>
          <span class="bpk-summary">${cap} spaces · ${spots.length} ${spots.length === 1 ? "area" : "areas"}</span>
          <span class="bpk-caret">›</span>
        </button>
        <div class="bpk-body">
          <div class="bpk-planwrap">
            <div class="bpk-plan" data-zoom="${esc(String(lvl.key))}">
              <span class="bpk-zoomhint">${zoomState[lvl.key] ? "Scroll to pan · click to shrink" : "Click map to enlarge"}</span>
              <div class="bpk-plan-inner">
                <img src="${esc(lvl.img)}" alt="${esc(lvl.label)} plan">
                ${pins}
              </div>
            </div>
          </div>
          <div class="bpk-cards">${cards}</div>
        </div>`;
      frame.appendChild(el);
    });
  }

  frame.addEventListener("click", function (e) {
    const shot = e.target.closest("[data-photo]");
    if (shot) { openLightbox(shot.getAttribute("data-photo"), +shot.getAttribute("data-idx") || 0); return; }
    const head = e.target.closest("[data-toggle]");
    if (head) { const k = head.getAttribute("data-toggle"); openState[keyFix(k)] = !openState[keyFix(k)]; render(); return; }
    const plan = e.target.closest("[data-zoom]");
    if (plan) { const k = plan.getAttribute("data-zoom"); zoomState[keyFix(k)] = !zoomState[keyFix(k)]; render(); }
  });

  // ---- Lightbox ----
  const lb = document.getElementById("bpk-lb");
  const lbImg = document.getElementById("bpk-lb-img");
  const lbCap = document.getElementById("bpk-lb-cap");
  let lbList = [], lbIdx = 0, lbName = "";
  function openLightbox(spotId, idx) {
    const s = SPOTS.find(x => x.id === spotId);
    if (!s) return;
    lbList = photosOf(s); if (!lbList.length) return;
    lbName = s.name; lbIdx = Math.max(0, Math.min(idx, lbList.length - 1));
    showLb();
    lb.classList.add("on");
  }
  function showLb() {
    lbImg.src = lbList[lbIdx];
    lbImg.alt = lbName;
    lbCap.textContent = lbName + (lbList.length > 1 ? "  \u00b7  " + (lbIdx + 1) + " / " + lbList.length : "");
  }
  function closeLb() { lb.classList.remove("on"); lbImg.src = ""; }
  function step(d) { if (lbList.length < 2) return; lbIdx = (lbIdx + d + lbList.length) % lbList.length; showLb(); }
  lb.addEventListener("click", function (e) {
    const act = e.target.getAttribute("data-lb");
    if (act === "prev") { step(-1); return; }
    if (act === "next") { step(1); return; }
    if (act === "close" || e.target === lb) closeLb();
  });
  document.addEventListener("keydown", function (e) {
    if (!lb.classList.contains("on")) return;
    if (e.key === "Escape") closeLb();
    else if (e.key === "ArrowLeft") step(-1);
    else if (e.key === "ArrowRight") step(1);
  });

  // level keys can be numbers or the string "outside"
  function keyFix(k) { return (k === "outside") ? "outside" : (isNaN(+k) ? k : +k); }

  render();
})();
</script>

</body>
</html>
